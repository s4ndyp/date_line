name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pluginversie uit manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> $GITHUB_OUTPUT

      - name: Controleren of release al bestaat
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" 2>/dev/null; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} bestaat al — overslaan."
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "Nieuwe release ${{ steps.version.outputs.version }} wordt gepubliceerd."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 20
          cache: npm

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Plugin-zip maken
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p dist/date-line
          cp main.js manifest.json styles.css versions.json dist/date-line/
          cd dist && zip -r ../date-line.zip date-line

      - name: GitHub Release publiceren
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
            date-line.zip
